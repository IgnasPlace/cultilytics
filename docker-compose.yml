version: "3.8"
services:
  cultilytics-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
  cultilytics:
    container_name: cultilytics
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "4000:4000"
    volumes:
      - /app/.data
    env_file:
      - .env
